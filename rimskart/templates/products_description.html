
{% load static %}
<div class="product-container">
        
    <!-- LEFT SIDE: IMAGES -->
    <div class="image-section">
        <div class="main-image-wrapper">
            <img src="{{ prod.image.url }}" alt="{{ prod.title }}">
        </div>
    </div> <!-- FIXED: Added missing closing div here -->

    <!-- RIGHT SIDE: INFO -->
    <div class="details-section">
        <div class="breadcrumb">{{ prod.title }}</div>
        <h1 class="product-title">{{ prod.title }}</h1>
        <div class="product-price">₹{{ prod.price|floatformat:2 }}</div>
        <form method="post" action="{% url 'add_to_cart' %}" enctype="multipart/form-data"> 
            {% csrf_token %}
        <div class="action-row">
            <input class="quantity-input" name="quantity" type="number" value="1" min="1" >
            <input type="hidden" name="product_id" value="{{ prod.id }}">
            <button class="add-to-cart-btn">Add To Cart</button>
        </div>    
        </form>

        <h2 class="description-title">Product Details</h2>
        <p class="description-text">
            {{ prod.description }}
        </p>
    </div>

</div>
