
{% load static %}
{% load chunks %}

<div class="header-container">
    <h1>All Products</h1>
    <select class="sort-select">
        <option>Default Sorting</option>
        <option>Price: Low to High</option>
        <option>Price: High to Low</option>
    </select>
</div>  
    
<div>
    <div class="products-grid">
        {% for values in prod %}
            <div class="product-card">
                <img class="product-image" src="{{ values.image.url }}" alt="{{ values.tittle }}">
                <h3>{{ values.tittle }}</h3>
                <p>₹{{ values.price }}</p>
            </div>
        {% endfor %}
    </div>
</div>

<div class = pagebutton>
    {% if prod.has_previous %}
        <a href="?page={{ prod.previous_page_number }}"><span><<</span></a>
    {% endif %}
   
    {% for page_num in prod.paginator.page_range %}
        <a href="?page={{ page_num }}"><span>{{ page_num }}</span></a>
    {% endfor %}
    
    {% if prod.has_next %}
        <a href="?page={{ prod.next_page_number }}"><span>>></span></a>
    {% endif %}
</div>
